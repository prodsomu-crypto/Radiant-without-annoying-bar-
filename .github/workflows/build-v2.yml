name: Build Radiant APK (Release)
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Release Signing & Hardware Acceleration
        run: |
          # Ensure release builds use debug signing so Gradle doesn't fail without a keystore
          for f in app/build.gradle app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' "$f"
              sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debug")/g' "$f"
            fi
          done
          # Ensure hardware acceleration isn't disabled in AndroidManifest.xml
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:hardwareAccelerated="false"/android:hardwareAccelerated="true"/g' app/src/main/AndroidManifest.xml
          fi

      - name: Build Optimized Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Locate & Prepare Finished APK
        run: |
          mkdir -p final_apk
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found!"
            exit 1
          fi
          cp "$APK_PATH" final_apk/Radiant-NoTopBar-Release.apk

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Radiant-NoTopBar-Release
          path: final_apk/Radiant-NoTopBar-Release.apk
